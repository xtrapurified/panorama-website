<title>Panorama · Chrome dither</title>
<meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-bleed WebGL stage, a thin mono control strip pinned to the bottom edge. Single dark look by choice. */
:root {
  --bg: #000;
  --ink: #f2f2f0;
  --dim: #8a8a86;
  --line: #262624;
  --panel: rgba(10,10,10,.82);
  --font-ui: ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
body.light { --bg: #fff; --ink: #0c0c0c; --dim: #6b6b67; --line: #dcdcd8; --panel: rgba(255,255,255,.85); }
#stage { touch-action: none; cursor: crosshair; position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center;
  font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim);
  transition: opacity .3s;
}
.bar.hide { opacity: 0; pointer-events: none; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl output { color: var(--ink); min-width: 3ch; font-variant-numeric: tabular-nums; }
input[type=range] { width: 92px; accent-color: var(--ink); }
button, .file {
  font: inherit; text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink); background: transparent; border: 1px solid var(--line);
  padding: 6px 10px; border-radius: 2px; cursor: pointer;
}
button:hover, .file:hover { border-color: var(--ink); }
button:focus-visible, input:focus-visible, .file:focus-within { outline: 1px solid var(--ink); outline-offset: 2px; }
button.rec { border-color: #c33; }
.file input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.spacer { flex: 1; }
.embed .bar { display: none; }
#msg { color: var(--ink); }
</style>

<canvas id="stage"></canvas>

<div class="bar" id="bar">
  <label class="ctl" for="px">Dot <input id="px" type="range" min="1" max="8" step="1" value="2"><output id="pxo">2</output></label>
  <label class="ctl" for="spd">Speed <input id="spd" type="range" min="0" max="2" step="0.05" value="0.7"><output id="spdo">0.7</output></label>
  <label class="ctl" for="pulse">Fade <input id="pulse" type="range" min="0" max="1" step="0.05" value="1"><output id="pulseo">1.0</output></label>
  <label class="ctl" for="size">Size <input id="size" type="range" min="0.2" max="0.9" step="0.01" value="0.9"><output id="sizeo">90</output></label>
  <label class="ctl" for="flow">Flow <input id="flow" type="range" min="0.2" max="2.5" step="0.05" value="2.5"><output id="flowo">2.5</output></label>
  <label class="ctl" for="turns">Turns <input id="turns" type="range" min="1" max="4" step="1" value="1"><output id="turnso">1</output></label>
  <label class="ctl" for="radial">Radial <input id="radial" type="range" min="0" max="12" step="0.5" value="5"><output id="radialo">5</output></label>
  <label class="ctl" for="res">Res shift <input id="res" type="range" min="0" max="4" step="1" value="0"><output id="reso">0</output></label>
  <label class="ctl" for="bevel">Bevel <input id="bevel" type="range" min="0" max="1" step="0.05" value="1"><output id="bevelo">1.00</output></label>
  <button id="inv" type="button">Invert</button>
  <label class="file" for="logo">Swap logo<input id="logo" type="file" accept="image/*"></label>
  <span class="spacer"></span>
  <span id="msg"></span>
  <button id="hideBtn" type="button" title="Press H to toggle">Hide [H]</button>
</div>

const canvas = document.getElementById('stage');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
const msg = document.getElementById('msg');
if (!gl) { msg.textContent = 'This browser has no WebGL2'; return; }

const TEX = 1024;

/* ---------- Logo mask: the globe redrawn as vectors (viewBox 330) ---------- */
function drawGlobe(ctx) {
  const s = TEX * 0.92 / 330, o = TEX * 0.04;
  ctx.save(); ctx.translate(o, o); ctx.scale(s, s);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 22; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.arc(165,165,145,0,Math.PI*2); ctx.stroke();       // outline
  ctx.save();
  ctx.beginPath(); ctx.arc(165,165,145,0,Math.PI*2); ctx.clip();          // keep inner lines inside
  ctx.beginPath(); ctx.moveTo(165,0); ctx.lineTo(165,330); ctx.stroke();   // meridian
  ctx.beginPath(); ctx.moveTo(0,165); ctx.lineTo(330,165); ctx.stroke();   // equator
  ctx.beginPath(); ctx.ellipse(165,165,72,145,0,0,Math.PI*2); ctx.stroke();// inner meridians
  ctx.beginPath(); ctx.moveTo(10,106); ctx.quadraticCurveTo(165,30,320,106); ctx.stroke(); // north latitude
  ctx.beginPath(); ctx.moveTo(10,224); ctx.quadraticCurveTo(165,300,320,224); ctx.stroke(); // south latitude
  ctx.restore(); ctx.restore();
}

function maskFromImage(ctx, img) {
  // Fit image, treat dark/opaque pixels as the logo.
  const tmp = document.createElement('canvas'); tmp.width = tmp.height = TEX;
  const t = tmp.getContext('2d');
  const sc = Math.min(TEX*0.92/img.width, TEX*0.92/img.height);
  const w = img.width*sc, h = img.height*sc;
  t.imageSmoothingQuality = 'high';
  t.drawImage(img, (TEX-w)/2, (TEX-h)/2, w, h);
  const a = t.getImageData(0,0,TEX,TEX).data;
  let transparent = 0; for (let i=3;i<a.length;i+=64) if (a[i] < 250) transparent++;
  if (transparent > a.length/64*0.05) {                 // logo on a transparent background: use its alpha
    const out = ctx.createImageData(TEX,TEX);
    for (let i=0;i<a.length;i+=4){ out.data[i]=out.data[i+1]=out.data[i+2]=a[i+3]; out.data[i+3]=255; }
    ctx.putImageData(out,0,0); return;
  }
  t.globalCompositeOperation = 'destination-over'; t.fillStyle = '#fff'; t.fillRect(0,0,TEX,TEX);
  const d = t.getImageData(0,0,TEX,TEX).data;
  // Decide polarity: if the image is mostly dark, the logo is the light part.
  let sum = 0; for (let i=0;i<d.length;i+=16) sum += d[i];
  const darkBg = sum/(d.length/16) < 128;
  const out = ctx.createImageData(TEX,TEX);
  for (let i=0;i<d.length;i+=4){
    const l = (d[i]*.3+d[i+1]*.59+d[i+2]*.11);
    const v = darkBg ? l : 255-l;
    out.data[i]=out.data[i+1]=out.data[i+2]=v; out.data[i+3]=255;
  }
  ctx.putImageData(out,0,0);
}

function boxBlur(src, w, h, r) {
  const tmp = new Float32Array(w*h), dst = new Float32Array(w*h), n = 2*r+1;
  for (let y=0;y<h;y++){ let acc=0; const row=y*w;
    for (let x=-r;x<=r;x++) acc += src[row+Math.min(w-1,Math.max(0,x))];
    for (let x=0;x<w;x++){ tmp[row+x]=acc/n;
      acc += src[row+Math.min(w-1,x+r+1)] - src[row+Math.max(0,x-r)]; } }
  for (let x=0;x<w;x++){ let acc=0;
    for (let y=-r;y<=r;y++) acc += tmp[Math.min(h-1,Math.max(0,y))*w+x];
    for (let y=0;y<h;y++){ dst[y*w+x]=acc/n;
      acc += tmp[Math.min(h-1,y+r+1)*w+x] - tmp[Math.max(0,y-r)*w+x]; } }
  return dst;
}

const maskTex = gl.createTexture(), heightTex = gl.createTexture();
function buildTextures() {
  const c = document.createElement('canvas'); c.width = c.height = TEX;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,TEX,TEX);
  if (customImg) maskFromImage(ctx, customImg); else drawGlobe(ctx);
  const d = ctx.getImageData(0,0,TEX,TEX).data;
  const m = new Float32Array(TEX*TEX);
  for (let i=0;i<m.length;i++) m[i] = d[i*4]/255;
  const r = 11;
  let h = boxBlur(m,TEX,TEX,r); h = boxBlur(h,TEX,TEX,r); h = boxBlur(h,TEX,TEX,r);
  // Rounded tube profile
  for (let i=0;i<h.length;i++) h[i] = Math.sqrt(Math.min(1, h[i]*1.6)) * m[i] + h[i]*0.15;
  const up = (tex, data) => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, TEX, TEX, 0, gl.RED, gl.FLOAT, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  };
  up(maskTex, m); up(heightTex, h);
}

/* ---------- Shader ---------- */
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const fs = `#version 300 es
precision highp float;
uniform sampler2D uM, uH;
uniform vec2 uRes; uniform float uT, uPx, uSize, uPulse, uInv, uBevel, uFlow, uRes2, uTurns, uRadial, uHover;
uniform vec2 uMouse;
out vec4 o;

float bayer8(ivec2 p){
  int x = p.x & 7, y = p.y & 7, xy = x ^ y;
  int v = ((xy&1)<<5) | ((x&1)<<4) | ((xy&2)<<2) | ((x&2)<<1) | ((xy&4)>>1) | ((x&4)>>2);
  return (float(v) + 0.5) / 64.0;
}
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s += a*vnoise(p); p = rot(.6)*p*2.03 + 7.1; a *= .5; } return s; }

float env(vec3 r, float t){
  r.xz = rot(t*0.55) * r.xz;
  r.yz = rot(sin(t*0.37)*0.9) * r.yz;
  float y = r.y;
  float c = y > 0. ? mix(0.6, 1.0, pow(max(y,0.),0.6)) : mix(0.3, 0.0, pow(max(-y,0.),0.5));
  return c + 0.8*exp(-pow(y*11.0, 2.0));
}

// Organized flow: a spiral phase, so light circles the outline and runs out along the inner lines
float chrome(vec2 p, float t, out float phase){
  vec2 o = vec2(0.);
  vec2 q = p - o;
  float th = atan(q.y, q.x);
  float r = length(q);
  phase = th*uTurns + r*uRadial - t*1.1 + 0.35*sin(t*0.4);
  phase += 0.5*(fbm(p*1.4 + vec2(t*0.08, 0.)) - 0.5);       // a little liquid wobble
  float w = 0.5 + 0.5*cos(phase);
  float c = smoothstep(0.0, 1.0, w);
  c = 0.34 + 0.62*pow(c, 1.3) + 0.45*pow(w, 14.0);           // dark tail -> bright body -> hot spot
  return c;
}

vec2 toUV(vec2 fc, float side){ vec2 uv = (fc - uRes*0.5)/side + 0.5; uv.y = 1.0 - uv.y; return uv; }

float lumAt(vec2 fc, float side, float breath, out float m){
  vec2 uv = toUV(fc, side);
  m = 0.;
  if (uv.x>0. && uv.x<1. && uv.y>0. && uv.y<1.) m = texture(uM, uv).r;
  if (m < 0.5) return 0.;
  float t = uT*uFlow;
  vec2 sp = (fc - uRes*0.5)/side; sp.y = -sp.y;
  float ph;
  float lum = chrome(sp, t, ph);
  // Tube cross-section: rims catch light, a thin reflection streak runs along one side
  float e = 1.5/1024.0;
  float dx = texture(uH, uv+vec2(e,0)).r - texture(uH, uv-vec2(e,0)).r;
  float dy = texture(uH, uv+vec2(0,e)).r - texture(uH, uv-vec2(0,e)).r;
  vec3 n = normalize(vec3(-dx*18.0, dy*18.0, 1.0));
  float rim = clamp(1.0 - n.z, 0., 1.);
  vec2 ld0 = normalize(vec2(cos(uT*0.3*uFlow), 0.6 + 0.4*sin(uT*0.2)));
  vec2 tm = uMouse - sp;
  vec2 ld = ld0;
  float sd = dot(normalize(n.xy + 1e-5), ld) * smoothstep(0.02, 0.25, rim);
  float streak = exp(-pow((sd - 0.55)*5.0, 2.0)) * smoothstep(0.15, 0.6, lum);
  float tube = lum*(0.7 + 0.6*rim) - 0.12*(1.0-rim)*(1.0-lum) + 0.55*streak;
  lum = mix(lum, tube, uBevel);
  // A small pool of liquid chrome travels with the pointer: dark core, rippling bright rings
  float d = length(tm);
  float near = (1.0 - smoothstep(0.025, 0.11, d)) * uHover;
  float ang = atan(tm.y, tm.x);
  float ripple = 0.5 + 0.5*cos(d*70.0 - uT*4.0 + 0.8*sin(ang*3.0 + uT*1.5));
  float pool = 0.04 + 0.95*pow(ripple, 3.0) * smoothstep(0.0, 0.035, d);
  lum = mix(lum, pool, near);
  breath = mix(breath, 1.0, near);
  lum *= mix(1.0, 0.42 + 0.58*breath, uPulse);
  return clamp(lum, 0., 1.);
}

void main(){
  float side = min(uRes.x, uRes.y) * uSize;
  float breath = 0.5 + 0.5*cos(uT*0.62);
  float m;
  // Coarse probe: darker regions drop to a bigger dot grid
  float big = uPx * (1.0 + uRes2);
  vec2 bc = floor(gl_FragCoord.xy / big);
  float lc = lumAt((bc+0.5)*big, side, breath, m);
  float cs = uPx;
  float dim = 1.0 - smoothstep(0.35, 0.7, lc);
  float lvl = floor(dim * uRes2 * smoothstep(1.0, 0.3, breath) + 0.5);  // resolution steps follow the fade
  cs = uPx * (1.0 + lvl);
  vec2 cell = floor(gl_FragCoord.xy / cs);
  float lum = lumAt((cell+0.5)*cs, side, breath, m);
  // keep the silhouette crisp at the fine grid
  float mf; lumAt((floor(gl_FragCoord.xy/uPx)+0.5)*uPx, side, breath, mf);
  float on = (mf > 0.5 && lum > bayer8(ivec2(cell))) ? 1. : 0.;
  if (uInv > 0.5) on = 1. - on;
  o = vec4(vec3(on), 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);

gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));

const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U = n => gl.getUniformLocation(prog, n);
const uRes=U('uRes'), uT=U('uT'), uPx=U('uPx'), uSize=U('uSize'), uPulse=U('uPulse'), uInv=U('uInv'), uBevel=U('uBevel'), uFlow=U('uFlow'), uRes2=U('uRes2'), uTurns=U('uTurns'), uRadial=U('uRadial'), uMouse=U('uMouse'), uHover=U('uHover');
gl.uniform1i(U('uM'),0); gl.uniform1i(U('uH'),1);

function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth*dpr); canvas.height = Math.round(innerHeight*dpr);
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize', resize); resize();
buildTextures();

/* Pointer: position in logo space (centre 0,0, y down), eased hover, speed boost */
const ptr = { x: 0, y: 0, tx: 0, ty: 0, in: false, hover: 0, vel: 0, lx: null, ly: null };
function toLogo(e){
  const side = Math.min(innerWidth, innerHeight) * +size.value;
  return [ (e.clientX - innerWidth/2) / side, (e.clientY - innerHeight/2) / side ];
}
canvas.addEventListener('pointermove', e => {
  const [x, y] = toLogo(e);
  if (ptr.lx !== null) ptr.vel = Math.min(3, ptr.vel + Math.hypot(x-ptr.lx, y-ptr.ly)*6);
  ptr.lx = x; ptr.ly = y; ptr.tx = x; ptr.ty = y; ptr.in = true;
});
