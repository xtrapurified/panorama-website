<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panorama · Clean globe</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:12px Helvetica,Arial,sans-serif}body.paper{background:#bcbfc0;color:#000}main{height:100svh;min-height:320px;display:grid;place-items:center;padding:65px 0 95px}panorama-globe-clean{width:min(72vw,72svh,704px);color:inherit}header,footer{position:fixed;left:24px;right:24px;display:flex;justify-content:space-between;gap:20px;align-items:center}header{top:24px}footer{bottom:24px}p{margin:0}.hint{color:#aaa}.paper .hint{color:#414141}.controls{display:flex;gap:24px}button{font:inherit;color:inherit;border:0;border-bottom:1px solid transparent;background:none;padding:8px 0;cursor:pointer}button:hover{border-bottom-color:currentColor}button:focus-visible{outline:1px solid currentColor;outline-offset:5px}::selection{background:#e33;color:#fff}.embed header,.embed footer{display:none}.embed main{min-height:0;padding:0}.embed panorama-globe-clean{width:min(100vw,100svh)}@media(max-width:600px){header,footer{left:18px;right:18px}footer{flex-wrap:wrap}.controls{width:100%;justify-content:space-between}panorama-globe-clean{width:min(96vw,65svh)}}
</style></head><body><header><p>Panorama Films</p><p>Clean globe · LE-007</p></header><main><panorama-globe-clean></panorama-globe-clean></main><footer><p class="hint">Drag to rotate · Arrow keys to turn</p><div class="controls"><button id="pause" aria-pressed="false">Pause</button><button id="theme">Black on grey</button><button id="reset">Reset</button></div></footer><script>/* Analytic 3D unit sphere, fixed camera, twelve rotating meridians.
   Antialiased analytic rendering at display resolution. Same fitted grid and axis as LE-004. */
(()=>{'use strict';
const TAU=Math.PI*2,STEP=TAU/12;
const P={tiltX:.48620472,tiltZ:-.36019945,phase:.06383834,latitudeStep:.31252038,latitudeOffset:-.04956525,parallelWidth:.99872093,meridianWidth:1.57808448,cx:31.22100407,cy:31.25494631,radius:25.55363215,polarTaper:.58121918};
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const periodic=(a,s)=>Math.abs(((a+s/2)%s+s)%s-s/2);
class PanoramaGlobe3D extends HTMLElement{
 static get observedAttributes(){return ['color','paused','speed'];}
 constructor(){super();this.angle=P.phase;this.velocity=0;this.drag=false;this.visible=true;this.resumeAt=0;this.raf=0;this.tick=this.tick.bind(this);this.frame=0;this.autoTime=0;this.lastPaint=-1;this.motion=matchMedia('(prefers-reduced-motion: reduce)');this._explicitPlay=false;
 this.attachShadow({mode:'open'}).innerHTML=`<style>:host{display:block;aspect-ratio:1;position:relative;color:var(--globe-color,#fff)}canvas{width:100%;height:100%;display:block;image-rendering:auto;cursor:grab;touch-action:pan-y;outline:none}canvas:active{cursor:grabbing}canvas:focus-visible{outline:1px solid currentColor;outline-offset:5px}</style><canvas width="64" height="64" tabindex="0" role="img" aria-label="Clean 3D globe. Drag horizontally to rotate on its fixed axis. Arrow keys rotate, Space pauses, Home resets."></canvas>`;
 this.canvas=this.shadowRoot.querySelector('canvas');this.ctx=this.canvas.getContext('2d',{alpha:true});this.N=0;this.resize=()=>{const n=Math.max(128,Math.min(1024,Math.round(this.clientWidth*Math.min(devicePixelRatio||1,2))));if(n===this.N)return;this.N=n;this.canvas.width=this.canvas.height=n;this.pixels=this.ctx.createImageData(n,n);for(const name of ['latitude','longitude','inside','latDistance','lonGradient','width'])this[name]=new Float32Array(n*n);this.setup();this.lastPaint=-1;this.render();};
 }
 setup(){const N=this.N,S=N/64,sx=Math.sin(P.tiltX),cx=Math.cos(P.tiltX),sz=Math.sin(P.tiltZ),cz=Math.cos(P.tiltZ);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,X=((x+.5)/S-.5-P.cx)/P.radius,Y=-((y+.5)/S-.5-P.cy)/P.radius,rr=X*X+Y*Y,Z=Math.sqrt(Math.max(1e-9,1-rr));this.inside[i]=Math.max(0,Math.min(1,(1-Math.sqrt(rr))*P.radius*S+.5));
   // Inverse camera orientation gives the 3D intersection in sphere-local space.
   const a=X*cz+Y*sz,b=-X*sz+Y*cz,q=b*cx+Z*sx,r=-b*sx+Z*cx;
   this.latitude[i]=Math.asin(Math.max(-1,Math.min(1,q)));this.longitude[i]=Math.atan2(a,r);
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,ym=Math.max(0,y-1)*N+x,yp=Math.min(N-1,y+1)*N+x,xm=y*N+Math.max(0,x-1),xp=y*N+Math.min(N-1,x+1);
   const dy=(this.latitude[yp]-this.latitude[ym])/(y===0||y===N-1?1:2),dx=(this.latitude[xp]-this.latitude[xm])/(x===0||x===N-1?1:2),lat=this.latitude[i];
   let dist=periodic(lat-P.latitudeOffset,P.latitudeStep)/Math.max(1e-5,Math.hypot(dx,dy));const nearest=Math.round((lat-P.latitudeOffset)/P.latitudeStep)*P.latitudeStep+P.latitudeOffset;if(Math.abs(nearest)>1.35)dist=1e6;this.latDistance[i]=dist;
   const ldy=wrap(this.longitude[yp]-this.longitude[ym])/2,ldx=wrap(this.longitude[xp]-this.longitude[xm])/2;this.lonGradient[i]=Math.max(1e-5,Math.hypot(ldx,ldy));this.width[i]=S*P.meridianWidth*Math.pow(Math.max(0,Math.cos(lat)),P.polarTaper);
  }
 }
 connectedCallback(){this.resize();this.resizer=new ResizeObserver(this.resize);this.resizer.observe(this);this.abort=new AbortController();const opts={signal:this.abort.signal};
 this.canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;this.drag=true;this.pointer=e.pointerId;this.x=e.clientX;this.lastMove=performance.now();this.velocity=0;this.canvas.setPointerCapture(e.pointerId);this.wake();},opts);
 this.canvas.addEventListener('pointermove',e=>{if(!this.drag||e.pointerId!==this.pointer)return;const now=performance.now(),dx=e.clientX-this.x,k=3.2/Math.max(160,this.clientWidth);this.angle+=dx*k;this.velocity=Math.max(-4,Math.min(4,dx*k/Math.max(.012,(now-this.lastMove)/1000)));this.x=e.clientX;this.lastMove=now;this.render();},opts);
 const release=e=>{if(e.pointerId!==this.pointer)return;this.drag=false;if(performance.now()-this.lastMove>100)this.velocity=0;this.resumeAt=performance.now()+1400;this.wake();};
 this.canvas.addEventListener('pointerup',release,opts);this.canvas.addEventListener('pointercancel',e=>{this.velocity=0;release(e);},opts);this.canvas.addEventListener('lostpointercapture',e=>{if(this.drag)release(e);},opts);
 this.canvas.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();this.angle+=(e.key==='ArrowRight'?1:-1)*Math.PI/90;this.velocity=0;this.resumeAt=performance.now()+1800;this.render();this.wake();}else if(e.code==='Space'){e.preventDefault();this.paused=!this.paused;}else if(e.key==='Home'){e.preventDefault();this.reset();}},opts);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.wake();},opts);this.motion.addEventListener('change',()=>this.wake(),opts);
 this.observer=new IntersectionObserver(entries=>{this.visible=entries[0].isIntersecting;if(this.visible)this.wake();});this.observer.observe(this);this.render();this.wake();
 }
 disconnectedCallback(){this.resize();this.resizer=new ResizeObserver(this.resize);this.resizer.observe(this);this.resizer?.disconnect();this.abort?.abort();this.observer?.disconnect();cancelAnimationFrame(this.raf);this.raf=0;}
 attributeChangedCallback(){if(this.pixels){this.lastPaint=-1;this.render();this.wake();}}
 get paused(){return this.hasAttribute('paused');}set paused(v){this._explicitPlay=!v;this.toggleAttribute('paused',!!v);this.velocity=0;this.wake();}
 get speed(){const v=Number(this.getAttribute('speed')??1);return Number.isFinite(v)?Math.max(-5,Math.min(5,v)):1;}
 get canPlay(){return !this.paused&&(!this.motion.matches||this._explicitPlay)&&this.speed!==0;}
 reset(){this.angle=P.phase;this.velocity=0;this.autoTime=0;this.frame=0;this.resumeAt=0;this.render();this.wake();}
 render(){if(!this.pixels||this.lastPaint===this.angle)return;const N=this.N,S=N/64;this.lastPaint=this.angle;const c=this.getAttribute('color')||getComputedStyle(this).color||'#fff';this.ctx.fillStyle=c;this.ctx.clearRect(0,0,1,1);this.ctx.fillRect(0,0,1,1);const rgb=this.ctx.getImageData(0,0,1,1).data;const data=this.pixels.data;
  for(let i=0;i<N*N;i++){const meridian=periodic(this.longitude[i]-this.angle,STEP)/this.lonGradient[i],ink=this.inside[i]*Math.max(0,Math.min(1,Math.max(P.parallelWidth*S/2-this.latDistance[i],this.width[i]/2-meridian)+.5)),j=i*4;data[j]=rgb[0];data[j+1]=rgb[1];data[j+2]=rgb[2];data[j+3]=Math.round(ink*255);}this.ctx.putImageData(this.pixels,0,0);this.dataset.angle=this.angle.toFixed(5);
 }
 wake(){if(this.isConnected&&!this.raf){this.lastTime=performance.now();this.raf=requestAnimationFrame(this.tick);}}
 tick(now){this.raf=0;if(!this.isConnected||document.hidden||!this.visible)return;const dt=Math.min(.05,(now-this.lastTime)/1000);this.lastTime=now;
  if(!this.drag){if(Math.abs(this.velocity)>.005){this.angle+=this.velocity*dt;this.velocity*=Math.exp(-5*dt);}else if(this.canPlay&&now>this.resumeAt){this.angle-=TAU/10*dt*this.speed;}}
  this.render();if(this.drag||Math.abs(this.velocity)>.005||this.canPlay)this.raf=requestAnimationFrame(this.tick);
 }
}
if(!customElements.get('panorama-globe-clean'))customElements.define('panorama-globe-clean',PanoramaGlobe3D);
})();
</script><script>
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');
const g=document.querySelector('panorama-globe-clean'),pause=document.querySelector('#pause');
pause.onclick=()=>g.paused=!g.paused;
function label(){pause.textContent=g.paused?'Play':'Pause';pause.setAttribute('aria-pressed',String(g.paused));}
new MutationObserver(label).observe(g,{attributes:true,attributeFilter:['paused']});
document.querySelector('#theme').onclick=e=>{const paper=document.body.classList.toggle('paper');g.setAttribute('color',paper?'#000':'#fff');e.target.textContent=paper?'White on black':'Black on grey';};
document.querySelector('#reset').onclick=()=>g.reset();
if(matchMedia('(prefers-reduced-motion:reduce)').matches)g.paused=true;label();
</script></body></html>
