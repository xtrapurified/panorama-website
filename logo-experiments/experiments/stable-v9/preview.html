<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panorama • Pixel Globe v9</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bcbfc0;font-family:Helvetica,Arial,sans-serif}
main{width:100%;height:100%;display:grid;place-items:center}
canvas{width:min(82vmin,820px);height:min(82vmin,820px);image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.info{position:fixed;bottom:16px;left:18px;font-size:11px;color:#333;opacity:.68;user-select:none}
</style><style>header,footer,.info{display:none!important}html,body{overflow:hidden!important}main{height:100svh!important;min-height:0!important;padding:0!important}main>canvas{width:90vmin!important;height:90vmin!important}main>panorama-globe,main>panorama-globe-3d,main>panorama-globe-lens,main>panorama-globe-optics{width:90vmin!important;max-width:none!important}</style></head><body><main><canvas width="132" height="132" id="globe"></canvas></main><div class="info">PANORAMA / GLOBE 09 · STABLE PIXEL MATCH · DRAG TO ROTATE · SPACE TO PAUSE</div><script>
(()=>{'use strict';
const c=document.getElementById('globe'), ctx=c.getContext('2d');
ctx.imageSmoothingEnabled=false;
let angle=.24, velocity=.0046, drag=false, lastX=0, paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LOW=132, HIGH=264, SCALE=2, C=LOW/2, R=51, CH=HIGH/2, RH=R*SCALE;
const BG=[188,191,192,255];
const tiltX=.54, tiltZ=-.24;
const imgLow=ctx.createImageData(LOW,LOW);
const hi = new Uint8Array(HIGH*HIGH); // 0 bg, 1 fg

function orient(lon,lat){
  const cl=Math.cos(lat), x=cl*Math.sin(lon+angle), y=Math.sin(lat), z=cl*Math.cos(lon+angle);
  let yy=y*Math.cos(tiltX)-z*Math.sin(tiltX), zz=y*Math.sin(tiltX)+z*Math.cos(tiltX);
  return {x:x*Math.cos(tiltZ)-yy*Math.sin(tiltZ), y:x*Math.sin(tiltZ)+yy*Math.cos(tiltZ), z:zz};
}
function clearHi(){ hi.fill(0); }
function setHi(x,y){ if(x<0||y<0||x>=HIGH||y>=HIGH) return; hi[y*HIGH+x]=1; }
function stampHi(x,y,w){
  if(w<=1){ setHi(x,y); return; }
  const r=Math.floor((w-1)/2);
  for(let yy=-r; yy<=r; yy++) for(let xx=-r; xx<=r; xx++) setHi(x+xx,y+yy);
}
function lineHi(x0,y0,x1,y1,w){
  x0|=0; y0|=0; x1|=0; y1|=0;
  let dx=Math.abs(x1-x0), sx=x0<x1?1:-1;
  let dy=-Math.abs(y1-y0), sy=y0<y1?1:-1;
  let err=dx+dy;
  while(true){
    stampHi(x0,y0,w);
    if(x0===x1 && y0===y1) break;
    const e2=2*err;
    if(e2>=dy){ err+=dy; x0+=sx; }
    if(e2<=dx){ err+=dx; y0+=sy; }
  }
}
function drawCurveHi(fn,t0,t1,steps,w){
  let last=null,lastVis=false;
  for(let i=0;i<=steps;i++){
    const t=t0+(t1-t0)*i/steps, p=fn(t), vis=p.z>=0;
    const sx=Math.round(CH+p.x*RH), sy=Math.round(CH-p.y*RH);
    if(last && vis && lastVis) lineHi(last.x,last.y,sx,sy,w);
    last={x:sx,y:sy}; lastVis=vis;
  }
}
function circleHi(cx,cy,r,w){
  let x=r,y=0,err=0;
  while(x>=y){
    const pts=[[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]];
    for(const [dx,dy] of pts) stampHi(cx+dx,cy+dy,w);
    y++; err += 1+2*y; if(2*(err-x)+1>0){ x--; err += 1-2*x; }
  }
}
function resolveToLow(){
  const d=imgLow.data;
  let p=0;
  for(let y=0;y<LOW;y++){
    const y2=y*SCALE;
    for(let x=0;x<LOW;x++){
      const x2=x*SCALE;
      const a=hi[y2*HIGH+x2], b=hi[y2*HIGH+x2+1], c=hi[(y2+1)*HIGH+x2], e=hi[(y2+1)*HIGH+x2+1];
      // Slightly heavier than V8 for darker/stronger line feel.
      const black=(a+b+c+e)>=2 || a+b+c+e===1 && (a||b||c||e) && ((x+y)&3)===0;
      if(black){ d[p]=0; d[p+1]=0; d[p+2]=0; d[p+3]=255; }
      else { d[p]=BG[0]; d[p+1]=BG[1]; d[p+2]=BG[2]; d[p+3]=255; }
      p+=4;
    }
  }
}
function render(){
  clearHi();
  const latitudes=[-1.18,-0.90,-0.63,-0.36,-0.09,0.18,0.46,0.76,1.05,1.23];
  for(const lat of latitudes) drawCurveHi(t=>orient(t,lat), -Math.PI, Math.PI, 200, 3);
  const meridians=9;
  for(let i=0;i<meridians;i++){
    const lon=i*2*Math.PI/meridians;
    drawCurveHi(t=>orient(lon,t), -Math.PI/2, Math.PI/2, 170, 3);
  }
  circleHi(CH,CH,RH,3);
  resolveToLow();
  ctx.putImageData(imgLow,0,0);
}
function tick(){ if(!paused && !drag){ angle+=velocity; velocity += (.0046-velocity)*.02; } render(); requestAnimationFrame(tick); }
c.addEventListener('pointerdown',e=>{ drag=true; lastX=e.clientX; c.setPointerCapture(e.pointerId); });
c.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-lastX; angle+=dx*.0105; velocity=dx*.0011; lastX=e.clientX; });
c.addEventListener('pointerup',()=>drag=false); c.addEventListener('pointercancel',()=>drag=false);
document.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); paused=!paused; } });
render(); requestAnimationFrame(tick);
})();
</script></body></html>
