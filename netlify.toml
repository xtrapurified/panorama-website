# Panorama Films website: a static site, no build step.
# Netlify serves the repo root as-is.
#
# Branches:
#   main -> production (panoramafilms.netlify.app). Each deploy costs credits,
#           so merge into main only when a version is approved.
#   dev  -> working branch. Netlify branch deploys are free and get their own
#           preview link (dev--panoramafilms.netlify.app).
[build]
  publish = "."
  command = ""

# Internal docs in the repo are not part of the site.
[[redirects]]
  from = "/project.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true
